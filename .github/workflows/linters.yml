# When updating this file, please also update the linter_workflow_template in frappe/utils/boilerplate.py
name: Linters

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commitcheck-frappe-${{ github.event_name }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: 'Semantic Commits'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 200
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Check commit titles
        run: |
          npm install @commitlint/cli @commitlint/config-conventional
          npx commitlint --verbose --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  docs-required:
    name: 'Documentation Required'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 'Setup Environment'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/checkout@v6

      - name: Validate Docs
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          pip install requests --quiet
          python $GITHUB_WORKSPACE/.github/helper/documentation.py $PR_NUMBER

  linter:
    name: 'Semgrep Rules'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/checkout@v6

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install and run pip-audit
        # CVE-2025-26240: no fix available upstream, but vulnerable `_find_options_in_meta` is monkey-patched in frappe (b828efe)
        # PYSEC-2026-*/CVE-2025-64512/CVE-2025-70559: pre-existing vulnerabilities in pypdf, pillow, weasyprint upstream
        run: |
          pip install pip-audit
          cd ${GITHUB_WORKSPACE}
          pip-audit --desc on \
            --ignore-vuln PYSEC-2023-312 \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln CVE-2025-26240 \
            --ignore-vuln CVE-2025-64512 \
            --ignore-vuln CVE-2025-70559 \
            --ignore-vuln PYSEC-2026-2253 \
            --ignore-vuln PYSEC-2026-2254 \
            --ignore-vuln PYSEC-2026-2255 \
            --ignore-vuln PYSEC-2026-2256 \
            --ignore-vuln PYSEC-2026-2257 \
            --ignore-vuln PYSEC-2026-3412 \
            --ignore-vuln PYSEC-2026-3451 \
            --ignore-vuln PYSEC-2026-3452 \
            --ignore-vuln PYSEC-2026-3453 \
            --ignore-vuln PYSEC-2026-3454 \
            --ignore-vuln PYSEC-2026-3493 \
            --ignore-vuln PYSEC-2026-3494 \
            --ignore-vuln PYSEC-2026-3495 \
            --ignore-vuln PYSEC-2026-3496 \
            --ignore-vuln PYSEC-2026-3610 \
            --ignore-vuln PYSEC-2026-3611 \
            --ignore-vuln PYSEC-2026-3612 \
            --ignore-vuln PYSEC-2026-3613 \
            --ignore-vuln PYSEC-2026-3655 \
            --ignore-vuln PYSEC-2026-3656 \
            --ignore-vuln GHSA-g75f-g53v-794x \
            --ignore-vuln GHSA-gj48-438w-jh9v \
            --ignore-vuln CVE-2026-71491 \
            --ignore-vuln CVE-2026-59894 \
            --ignore-vuln CVE-2026-59893 \
            --ignore-vuln CVE-2026-54284 \
            .

  precommit:
    name: 'Pre-Commit'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - uses: pre-commit/action@v3.0.1
