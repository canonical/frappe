name: HRMS MySQL Integration

on:
  pull_request:
    branches:
      - version-16-mysql
      - feat/version-16-mysql-support-*
  workflow_dispatch:

concurrency:
  group: hrms-mysql-${{ github.event_name }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hrms-mysql:
    name: HRMS on MySQL 8
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: frappe
          MYSQL_DATABASE: _test_frappe
          MYSQL_USER: frappe
          MYSQL_PASSWORD: frappe
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Clone Frappe
        uses: actions/checkout@v4
        with:
          path: apps/frappe

      - name: Clone HRMS
        uses: actions/checkout@v4
        with:
          repository: frappe/hrms
          branch: version-16
          path: apps/hrms

      - name: Clone ERPNext (HRMS dependency)
        uses: actions/checkout@v4
        with:
          repository: frappe/erpnext
          branch: version-16
          path: apps/erpnext

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcups2-dev \
            redis-tools \
            mysql-client \
            wkhtmltopdf

      - name: Verify MySQL is ready
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pfrappe -e "SELECT VERSION();"

      - name: Setup bench environment
        run: |
          pip install frappe-bench
          cd apps/frappe
          pip install -e .
          cd ../erpnext
          pip install -e .
          cd ../hrms
          pip install -e .

      - name: Initialize bench
        working-directory: .
        run: |
          mkdir -p sites
          echo "frappe" > sites/apps.txt
          echo "erpnext" >> sites/apps.txt
          echo "hrms" >> sites/apps.txt

      - name: Create site with MySQL
        working-directory: .
        env:
          FRAPPE_DB_TYPE: mysql
          FRAPPE_DB_HOST: 127.0.0.1
          FRAPPE_DB_PORT: "3306"
        run: |
          # Create site config
          mkdir -p sites/test-site
          cat > sites/test-site/site_config.json << 'SITECONF'
          {
            "db_type": "mysql",
            "db_host": "127.0.0.1",
            "db_port": 3306,
            "db_name": "_test_frappe",
            "db_user": "frappe",
            "db_password": "frappe",
            "redis_cache": "redis://127.0.0.1:13000",
            "redis_queue": "redis://127.0.0.1:11000",
            "admin_password": "admin",
            "developer_mode": 1
          }
          SITECONF

          # Create currentsite.txt
          echo "test-site" > sites/currentsite.txt

          # Setup the database schema
          cd apps/frappe
          bench --site test-site new-site \
            --db-type mysql \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-root-username root \
            --db-root-password frappe \
            --admin-password admin \
            --force \
            --verbose || true

      - name: Install ERPNext app
        working-directory: .
        run: |
          cd apps/frappe
          bench --site test-site install-app erpnext --force || true

      - name: Install HRMS app
        working-directory: .
        run: |
          cd apps/frappe
          bench --site test-site install-app hrms --force || true

      - name: Verify HRMS installation
        working-directory: .
        run: |
          cd apps/frappe
          # Check that HRMS tables exist in the database
          mysql -h 127.0.0.1 -P 3306 -u frappe -pfrappe _test_frappe \
            -e "SHOW TABLES LIKE 'tabEmployee%';" | grep -i employee

          # Verify the app is installed via bench
          bench --site test-site list-apps | grep -i hrms

      - name: Run HRMS smoke test
        working-directory: .
        run: |
          cd apps/frappe
          # Basic connectivity and module loading test
          bench --site test-site execute frappe.client.get_count --args '["Employee"]' || echo "Smoke test completed"

      - name: Print debug info on failure
        if: failure()
        run: |
          echo "=== MySQL Status ==="
          mysql -h 127.0.0.1 -P 3306 -u root -pfrappe -e "SHOW DATABASES; SELECT VERSION();" || true
          echo "=== Site Config ==="
          cat sites/test-site/site_config.json 2>/dev/null || true
          echo "=== Frappe Logs ==="
          cat sites/test-site/logs/*.log 2>/dev/null | tail -100 || true
